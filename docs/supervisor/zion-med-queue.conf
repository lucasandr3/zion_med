; Fila Laravel (PDF, e-mails, webhooks, auditoria)
; Instalar em: /etc/supervisor/conf.d/zion-med-queue.conf
;
; Ajuste directory e command se o projeto não estiver em /var/www/zion_med
; e se o PHP não for /usr/bin/php (ex.: /usr/bin/php8.4).

[program:zion-med-queue]
process_name=%(program_name)s
command=/usr/bin/php artisan queue:work --sleep=3 --tries=3 --max-time=3600 --memory=256
directory=/var/www/zion_med
user=www-data
autostart=true
autorestart=true
startsecs=3
startretries=10
stopwaitsecs=3600
stopasgroup=true
killasgroup=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/zion_med/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
