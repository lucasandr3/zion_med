; Agendador Laravel (billing, lembretes, retenção LGPD, trials…)
; Instalar em: /etc/supervisor/conf.d/zion-med-scheduler.conf
;
; Ajuste directory e command se o projeto não estiver em /var/www/zion_med
; e se o PHP não for /usr/bin/php (ex.: /usr/bin/php8.4).

[program:zion-med-scheduler]
process_name=%(program_name)s
command=/usr/bin/php artisan schedule:work
directory=/var/www/zion_med
user=www-data
autostart=true
autorestart=true
startsecs=3
startretries=10
stopasgroup=true
killasgroup=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/zion_med/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
